name: PolySynth WCLAP WASI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'examples/polysynth/**'
      - 'examples/common/preset*.h'
      - 'examples/common/presets/**'
      - 'examples/tests/preset_portability/**'
      - 'examples/cmake/PresetResources.cmake'
      - 'examples/CMakeLists.txt'
      - 'cmake/WebviewGuiWclap.cmake'
      - 'include/webview-gui/**'
      - '.github/scripts/apply_wclap_preset_discovery_upstream.py'
      - '.github/scripts/patch_clap_trap_wclap.py'
      - '.github/scripts/patch_clap_trap_wclap_presets.py'
      - '.github/scripts/patch_clap_trap_wclap_discovery_smoke.py'
      - '.github/scripts/patch_clap_trap_wclap_discovery_concurrency.py'
      - '.github/scripts/patch_wclap_preset_discovery_bridge.py'
      - '.github/scripts/patch_wclap_preset_discovery_thread_safety.py'
      - '.github/scripts/patch_wclap_preset_null_semantics.py'
      - '.github/workflows/polysynth-wclap.yml'
  workflow_dispatch:

concurrency:
  group: polysynth-wclap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  polysynth-wasi:
    name: wasi-sdk-33 PolySynth WCLAP bundle
    runs-on: ubuntu-24.04
    env:
      WASI_VERSION: '33'
      WASI_VERSION_FULL: '33.0'
      WASI_ARCHIVE: wasi-sdk-33.0-x86_64-linux.tar.gz
      WASI_SHA256: 0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce
      CLAP_TRAP_REV: c75d353dc57140cfceebf96dcbea9c491bef4f10
      WCLAP_BRIDGE_REV: cd11d22afbe2af350f24cd56e6e0536e5ca86452

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Verify WCLAP preset entry contract
        run: >-
          cmake -DWEBVIEW_GUI_ROOT="${GITHUB_WORKSPACE}"
          -P examples/tests/preset_portability/wclap_preset_surface_contract.cmake

      - name: Install build and lifecycle-host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install pinned WASI SDK
        run: |
          curl --fail --location --retry 3 \
            --output "${WASI_ARCHIVE}" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/${WASI_ARCHIVE}"
          echo "${WASI_SHA256}  ${WASI_ARCHIVE}" | sha256sum --check --strict
          tar xzf "${WASI_ARCHIVE}"
          echo "WASI_SDK_PATH=${GITHUB_WORKSPACE}/wasi-sdk-${WASI_VERSION_FULL}-x86_64-linux" >> "${GITHUB_ENV}"

      - name: Configure current PolySynth WCLAP
        run: >-
          cmake -S examples/polysynth/wclap -B build-polysynth-wclap -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="${WASI_SDK_PATH}/share/cmake/wasi-sdk-pthread.cmake"

      - name: Build current PolySynth WCLAP
        run: cmake --build build-polysynth-wclap --target webview_gui_example_polysynth_wclap --parallel

      - name: Verify bundle layout, preset bank and WASM ABI
        run: |
          test -f build-polysynth-wclap/WebviewGuiPolySynth.wclap/module.wasm
          test -f build-polysynth-wclap/WebviewGuiPolySynth.wclap.tar.gz
          python3 examples/tests/preset_portability/verify_packaged_presets.py \
            --artifact build-polysynth-wclap/WebviewGuiPolySynth.wclap \
            --canonical examples/common/presets/bundled
          node - <<'NODE'
          const fs = require('fs');
          const bytes = fs.readFileSync('build-polysynth-wclap/WebviewGuiPolySynth.wclap/module.wasm');
          const module = new WebAssembly.Module(bytes);
          const exports = WebAssembly.Module.exports(module).map(x => x.name);
          for (const required of ['clap_entry', 'malloc']) {
            if (!exports.includes(required)) throw new Error(`missing WASM export: ${required}`);
          }
          const imports = WebAssembly.Module.imports(module);
          for (const entry of imports) {
            if (/gtk|webkit|cocoa|user32|ole32/i.test(`${entry.module}:${entry.name}`))
              throw new Error(`native GUI import leaked into WCLAP: ${entry.module}:${entry.name}`);
          }
          NODE
          tar tzf build-polysynth-wclap/WebviewGuiPolySynth.wclap.tar.gz | grep -F 'WebviewGuiPolySynth.wclap/module.wasm'
          test "$(tar tzf build-polysynth-wclap/WebviewGuiPolySynth.wclap.tar.gz | grep -c '\.wvpreset$')" -eq 9

      - name: Build pinned WCLAP lifecycle, WebView and preset discovery/load smoke host
        run: |
          git clone --filter=blob:none https://github.com/dfl/clap-trap.git .ci/clap-trap
          git -C .ci/clap-trap checkout "${CLAP_TRAP_REV}"
          git clone --filter=blob:none https://github.com/WebCLAP/wclap-bridge.git .ci/clap-trap/wclap-bridge
          git -C .ci/clap-trap/wclap-bridge checkout "${WCLAP_BRIDGE_REV}"
          git -C .ci/clap-trap/wclap-bridge submodule update --init --recursive

          python3 .github/scripts/apply_wclap_preset_discovery_upstream.py \
            --bridge-module .ci/clap-trap/wclap-bridge/source/_generic/wclap-module.h \
            --loader-header .ci/clap-trap/include/clap-trap/plugin-loader.h \
            --loader-source .ci/clap-trap/src/plugin-loader.cpp \
            --emit-patch "${GITHUB_WORKSPACE}/.ci/wclap-preset-discovery.patch"
          test -s .ci/wclap-preset-discovery.patch
          git -C .ci/clap-trap/wclap-bridge checkout -- source/_generic/wclap-module.h
          git -C .ci/clap-trap/wclap-bridge apply --check "${GITHUB_WORKSPACE}/.ci/wclap-preset-discovery.patch"
          git -C .ci/clap-trap/wclap-bridge apply "${GITHUB_WORKSPACE}/.ci/wclap-preset-discovery.patch"
          git -C .ci/clap-trap/wclap-bridge diff --check
          python3 .github/scripts/patch_clap_trap_wclap.py \
            --source .ci/clap-trap/examples/cli.cpp \
            --sync-magic WVS1 \
            --instrument
          python3 .github/scripts/patch_clap_trap_wclap_presets.py \
            --source .ci/clap-trap/examples/cli.cpp \
            --preset-load-key polysynth:bass \
            --expected-param-id 1000 \
            --expected-param-value -3
          python3 .github/scripts/patch_clap_trap_wclap_discovery_smoke.py \
            --source .ci/clap-trap/examples/cli.cpp \
            --expected-plugin-id com.webview-gui.example.polysynth
          python3 .github/scripts/patch_clap_trap_wclap_discovery_concurrency.py \
            --source .ci/clap-trap/examples/cli.cpp

          cmake -S .ci/clap-trap -B build-clap-trap -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLAP_TRAP_BUILD_TESTS=OFF
          cmake --build build-clap-trap --target clap-trap-cli --parallel

      - name: Execute real PolySynth WCLAP lifecycle, WebView and preset discovery/load smoke twice
        run: |
          ./build-clap-trap/clap-trap validate build-polysynth-wclap/WebviewGuiPolySynth.wclap --blocks 4
          ./build-clap-trap/clap-trap validate build-polysynth-wclap/WebviewGuiPolySynth.wclap --blocks 4

      - name: Upload PolySynth WCLAP bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webview-gui-polysynth-wclap
          if-no-files-found: error
          path: |
            build-polysynth-wclap/WebviewGuiPolySynth.wclap/
            build-polysynth-wclap/WebviewGuiPolySynth.wclap.tar.gz
