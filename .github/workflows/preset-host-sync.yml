name: Preset host and GUI sync

on:
  pull_request:
    paths:
      - 'examples/gain/**'
      - 'examples/polysynth/**'
      - 'examples/common/preset_*.h'
      - 'examples/common/presets/**'
      - 'examples/tests/preset_host_sync/**'
      - 'include/webview-gui/**'
      - '.github/workflows/preset-host-sync.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/gain/**'
      - 'examples/polysynth/**'
      - 'examples/common/preset_*.h'
      - 'examples/common/presets/**'
      - 'examples/tests/preset_host_sync/**'
      - 'include/webview-gui/**'
      - '.github/workflows/preset-host-sync.yml'
  workflow_dispatch:

concurrency:
  group: preset-host-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preset-host-sync:
    name: ${{ matrix.os }} preset host/UI sync
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Configure preset host/UI sync contract
        run: cmake -S examples/tests/preset_host_sync -B build-preset-host-sync

      - name: Build preset host/UI sync contract
        run: >-
          cmake --build build-preset-host-sync --config Debug --parallel --target
          webview_gui_preset_host_sync_tests
          webview_gui_preset_notification_tests

      - name: Run preset host/UI sync contract
        run: >-
          ctest --test-dir build-preset-host-sync -C Debug --output-on-failure --no-tests=error
          -R '^webview_gui_preset_(host_sync|notification)$'
