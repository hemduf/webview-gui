name: Automation review fix PR 114

on:
  push:
    branches:
      - fix/standalone-device-ui-runtime
    paths:
      - .github/workflows/_automation_review_fix_114.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Bound host-provided fixed-width strings and add regression coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          bridge = Path('include/webview-gui/_impl/standalone_device_bridge.h')
          text = bridge.read_text()
          old = '''    static std::string jsonString(const char *text) {
              std::string result{"\\\""};
              if (text) {
                  for (const unsigned char c : std::string{text}) {
                      switch (c) {
          '''
          new = '''    static std::string jsonString(const char *text, size_t capacity) {
              std::string result{"\\\""};
              if (text) {
                  size_t length = 0;
                  while (length < capacity && text[length] != '\\0')
                      ++length;
                  for (size_t i = 0; i < length; ++i) {
                      const auto c = static_cast<unsigned char>(text[i]);
                      switch (c) {
          '''
          if old not in text:
              raise SystemExit('jsonString implementation anchor not found')
          text = text.replace(old, new, 1)
          replacements = {
              'jsonString(info.name)\n                     << ",\\\"displayName\\\":" << jsonString(info.display_name)':
                  'jsonString(info.name, sizeof(info.name))\n                     << ",\\\"displayName\\\":" << jsonString(info.display_name, sizeof(info.display_name))',
              'jsonString(info.name)\n                     << ",\\\"inputChannels\\\":"':
                  'jsonString(info.name, sizeof(info.name))\n                     << ",\\\"inputChannels\\\":"',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f'call-site anchor not found: {before}')
              text = text.replace(before, after, 1)
          bridge.write_text(text)

          test = Path('tests/standalone_device_bridge/standalone_device_bridge_tests.cpp')
          text = test.read_text()
          old = '''        case CLAP_WRAPPER_STANDALONE_MIDI_OUTPUT:
              info->id = 0;
              copyText(info->name, "MIDI Output");
              return true;
          '''
          new = '''        case CLAP_WRAPPER_STANDALONE_MIDI_OUTPUT:
              info->id = 0;
              // Host-owned fixed-width buffers are not guaranteed to be NUL-terminated.
              // Fill the complete field and make the following word non-zero so an
              // unbounded C-string conversion would consume bytes past `name`.
              std::memset(info->name, 'M', sizeof(info->name));
              info->input_channels = 0x41414141u;
              return true;
          '''
          if old not in text:
              raise SystemExit('MIDI output fixture anchor not found')
          text = text.replace(old, new, 1)
          old = '''    require(json.find("MIDI Input") != std::string::npos,
              "MIDI input snapshot missing");
          '''
          new = '''    require(json.find("MIDI Input") != std::string::npos,
              "MIDI input snapshot missing");
              const std::string boundedMidiOutputName(
                  CLAP_WRAPPER_STANDALONE_DEVICE_NAME_CAPACITY, 'M');
              require(json.find("\\\"name\\\":\\\"" + boundedMidiOutputName +
                                "\\\",\\\"inputChannels\\\":1094795585") != std::string::npos,
                      "fixed-width host device name was not bounded to its declared capacity");
          '''
          if old not in text:
              raise SystemExit('snapshot assertion anchor not found')
          text = text.replace(old, new, 1)
          test.write_text(text)
          PY
          rm -f .github/workflows/_automation_review_fix_114.yml
          git add -A
          git commit -m "fix: bound standalone host device strings"
          git push origin HEAD:fix/standalone-device-ui-runtime
