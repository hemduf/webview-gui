name: Examples aggregate qualification

on:
  pull_request:
    paths:
      - 'examples/**'
      - 'cmake/**'
      - '.github/workflows/gain-core.yml'
      - '.github/workflows/polysynth-core.yml'
      - '.github/workflows/gain-wclap.yml'
      - '.github/workflows/polysynth-wclap.yml'
      - '.github/workflows/examples-formats.yml'
      - '.github/workflows/examples-qualification.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/**'
      - 'cmake/**'
      - '.github/workflows/gain-core.yml'
      - '.github/workflows/polysynth-core.yml'
      - '.github/workflows/gain-wclap.yml'
      - '.github/workflows/polysynth-wclap.yml'
      - '.github/workflows/examples-formats.yml'
      - '.github/workflows/examples-qualification.yml'
  workflow_dispatch:

concurrency:
  group: examples-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Aggregate qualification contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Verify aggregate qualification ownership and gates
        run: >-
          cmake
          -DGAIN_CORE_WORKFLOW="${{ github.workspace }}/.github/workflows/gain-core.yml"
          -DPOLYSYNTH_CORE_WORKFLOW="${{ github.workspace }}/.github/workflows/polysynth-core.yml"
          -DGAIN_WCLAP_WORKFLOW="${{ github.workspace }}/.github/workflows/gain-wclap.yml"
          -DPOLYSYNTH_WCLAP_WORKFLOW="${{ github.workspace }}/.github/workflows/polysynth-wclap.yml"
          -DFORMATS_WORKFLOW="${{ github.workspace }}/.github/workflows/examples-formats.yml"
          -DREADME_FILE="${{ github.workspace }}/examples/README.md"
          -P "${{ github.workspace }}/examples/tests/aggregate_qualification_contract.cmake"
