name: PolySynth core contract

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    paths:
      - 'examples/polysynth/**'
      - 'examples/tests/polysynth_voice_allocator_tests.cpp'
      - 'examples/tests/polysynth_note_scheduler_tests.cpp'
      - 'examples/tests/polysynth_voice_lifecycle_tests.cpp'
      - 'examples/tests/polysynth_voice_engine_tests.cpp'
      - 'examples/tests/polysynth_amp_envelope_tests.cpp'
      - 'examples/tests/polysynth_filter_tests.cpp'
      - 'examples/tests/polysynth_mix_controls_tests.cpp'
      - 'examples/tests/polysynth_filter_envelope_tests.cpp'
      - 'examples/tests/polysynth_oscillator_tuning_tests.cpp'
      - 'examples/tests/polysynth_polyphonic_parameter_state_tests.cpp'
      - 'examples/tests/polysynth_event_stream_tests.cpp'
      - 'examples/tests/polysynth_parameter_model_tests.cpp'
      - 'examples/tests/polysynth_parameter_event_tests.cpp'
      - 'examples/tests/polysynth_note_expression_tests.cpp'
      - 'examples/tests/polysynth_pan_expression_tests.cpp'
      - 'examples/tests/polysynth_brightness_expression_tests.cpp'
      - 'examples/tests/polysynth_expression_expression_tests.cpp'
      - 'examples/tests/polysynth_pressure_expression_tests.cpp'
      - 'examples/tests/polysynth_note_expression_stream_tests.cpp'
      - 'examples/tests/polysynth_clap_ports_tests.cpp'
      - 'examples/tests/polysynth_voice_info_tests.cpp'
      - 'examples/tests/polysynth_state_tests.cpp'
      - 'examples/CMakeLists.txt'
      - '.github/workflows/polysynth-core.yml'
  workflow_dispatch:

concurrency:
  group: polysynth-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.os }} PolySynth core
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Configure PolySynth core tests
        run: >-
          cmake
          -S examples
          -B build-polysynth-core
          -DWEBVIEW_GUI_SOURCE_DIR="${{ github.workspace }}"
          -DWEBVIEW_GUI_EXAMPLES_BUILD_GAIN=OFF
          -DWEBVIEW_GUI_EXAMPLES_BUILD_POLYSYNTH=ON
          -DWEBVIEW_GUI_EXAMPLES_BUILD_WRAPPERS=OFF

      - name: Build PolySynth core tests
        run: >-
          cmake --build build-polysynth-core
          --target webview_gui_example_polysynth_voice_allocator_tests
          webview_gui_example_polysynth_note_scheduler_tests
          webview_gui_example_polysynth_voice_lifecycle_tests
          webview_gui_example_polysynth_voice_engine_tests
          webview_gui_example_polysynth_amp_envelope_tests
          webview_gui_example_polysynth_filter_tests
          webview_gui_example_polysynth_mix_controls_tests
          webview_gui_example_polysynth_filter_envelope_tests
          webview_gui_example_polysynth_oscillator_tuning_tests
          webview_gui_example_polysynth_polyphonic_parameter_state_tests
          webview_gui_example_polysynth_event_stream_tests
          webview_gui_example_polysynth_parameter_model_tests
          webview_gui_example_polysynth_parameter_event_tests
          webview_gui_example_polysynth_note_expression_tests
          webview_gui_example_polysynth_pan_expression_tests
          webview_gui_example_polysynth_brightness_expression_tests
          webview_gui_example_polysynth_expression_expression_tests
          webview_gui_example_polysynth_pressure_expression_tests
          webview_gui_example_polysynth_note_expression_stream_tests
          webview_gui_example_polysynth_clap_ports_tests
          webview_gui_example_polysynth_voice_info_tests
          webview_gui_example_polysynth_state_tests
          webview_gui_example_polysynth
          --config Debug --parallel

      - name: Run PolySynth core tests
        run: >-
          ctest --test-dir build-polysynth-core -C Debug --output-on-failure
          --no-tests=error -R '^webview_gui_examples_polysynth_(voice_allocator|note_scheduler|voice_lifecycle|voice_engine|amp_envelope|filter|mix_controls|filter_envelope|oscillator_tuning|polyphonic_parameter_state|event_stream|parameter_model|parameter_event|note_expression|pan_expression|brightness_expression|expression_expression|pressure_expression|note_expression_stream|clap_ports|voice_info|state)$'
