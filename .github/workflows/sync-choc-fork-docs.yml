name: Sync CHOC fork integration docs

on:
  push:
    branches:
      - choc-fork-cpm

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: choc-fork-cpm
          fetch-depth: 0

      - name: Update documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'README.md',
              'The CHOC revision used for qualification is pinned in the submodule and documented in `CHOC_PIN.md`.',
              'The qualified CHOC revision is pinned directly in `CMakeLists.txt` and fetched through CPM from the maintained [`hemduf/choc`](https://github.com/hemduf/choc) fork.',
              'README CHOC pin')

          replace_once(
              'README.md',
              'Production plug-in integration must use the repository CMake target. Standalone `WEBVIEW_GUI_HEADER_ONLY` integration is intentionally unsupported by the plug-in-safe profile and fails at compile time with a clear diagnostic. The native backends require generated, private CHOC hardening on macOS, Windows and Linux; compiling directly from the repository headers would otherwise either fail platform-specifically or silently bypass qualified unload/lifetime and security patches.',
              'Production plug-in integration must use the repository CMake target. Standalone `WEBVIEW_GUI_HEADER_ONLY` integration is intentionally unsupported by the plug-in-safe profile and fails at compile time with a clear diagnostic. The target fetches the exact pinned `hemduf/choc` revision through CPM; native WebView lifetime hardening lives in that fork, while `webview-gui` opts into its plug-in-safe profile and supplies project-specific security policy hooks.',
              'README production integration')

          replace_once(
              'README.md',
              'Do not install or link a shared `webview-gui`/CHOC runtime between unrelated audio plug-ins. Do not define `WEBVIEW_GUI_HEADER_ONLY` in a production plug-in. The supported CMake path generates the platform-specific private CHOC copy, applies drift-checked hardening, and puts that copy ahead of the immutable pinned submodule headers.',
              'Do not install or link a shared `webview-gui`/CHOC runtime between unrelated audio plug-ins. Do not define `WEBVIEW_GUI_HEADER_ONLY` in a production plug-in. The supported CMake path resolves the immutable CHOC fork revision through CPM and compiles it privately as part of the same plug-in image.',
              'README plugin-safe path')

          replace_once(
              'docs/getting-started.md',
              '- recursive Git submodules\n- network access on first configure for pinned CLAP dependencies',
              '- network access on first configure for CPM-fetched CHOC and pinned CLAP dependencies',
              'getting-started requirements')

          replace_once(
              'docs/getting-started.md',
              'git clone --recurse-submodules https://github.com/hemduf/webview-gui.git\ncd webview-gui\ngit submodule update --init --recursive',
              'git clone https://github.com/hemduf/webview-gui.git\ncd webview-gui',
              'getting-started clone')

          replace_once(
              'docs/getting-started.md',
              'gh pr checkout 86\ngit submodule update --init --recursive',
              'gh pr checkout 86',
              'getting-started gh checkout')

          replace_once(
              'docs/getting-started.md',
              'git fetch origin refs/pull/86/head:pr-86\ngit switch pr-86\ngit submodule update --init --recursive',
              'git fetch origin refs/pull/86/head:pr-86\ngit switch pr-86',
              'getting-started manual PR checkout')

          replace_once(
              'docs/getting-started.md',
              'git switch feat/35-example-qualification\ngit pull --ff-only\ngit submodule update --init --recursive',
              'git switch feat/35-example-qualification\ngit pull --ff-only',
              'getting-started branch checkout')

          readme = Path('README.md').read_text()
          guide = Path('docs/getting-started.md').read_text()
          for forbidden in ('CHOC_PIN.md', 'private CHOC copy', 'pinned submodule headers', 'generated, private CHOC hardening'):
              if forbidden in readme:
                  raise SystemExit(f'stale README wording remains: {forbidden}')
          if 'git submodule' in guide or 'recursive Git submodules' in guide:
              raise SystemExit('stale submodule checkout instructions remain')
          PY

          rm .github/workflows/sync-choc-fork-docs.yml
          git diff --check

      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document CPM-based CHOC fork integration"
          git push origin HEAD:choc-fork-cpm
