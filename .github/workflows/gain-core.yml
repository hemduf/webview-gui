name: Gain core contract

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    paths:
      - 'examples/gain/**'
      - 'examples/tests/gain_core_tests.cpp'
      - 'examples/tests/gain_meter_tests.cpp'
      - 'examples/tests/gain_clap_adapter_tests.cpp'
      - 'examples/tests/gain_webview_resource_tests.cpp'
      - 'examples/tests/gain_webview_param_tests.cpp'
      - 'examples/CMakeLists.txt'
      - '.github/workflows/gain-core.yml'
  workflow_dispatch:

concurrency:
  group: gain-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gain-core:
    name: ${{ matrix.os }} Gain core
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Configure Gain tests
        run: >-
          cmake
          -S examples
          -B build-gain-core
          -DWEBVIEW_GUI_SOURCE_DIR="${{ github.workspace }}"
          -DWEBVIEW_GUI_EXAMPLES_BUILD_GAIN=ON
          -DWEBVIEW_GUI_EXAMPLES_BUILD_POLYSYNTH=OFF
          -DWEBVIEW_GUI_EXAMPLES_BUILD_WRAPPERS=OFF

      - name: Build Gain CLAP and tests
        run: >-
          cmake --build build-gain-core
          --target webview_gui_example_gain webview_gui_example_gain_core_tests webview_gui_example_gain_meter_tests webview_gui_example_gain_clap_tests webview_gui_example_gain_webview_resource_tests webview_gui_example_gain_webview_param_tests
          --config Debug --parallel

      - name: Run Gain tests
        run: >-
          ctest --test-dir build-gain-core -C Debug --output-on-failure
          --no-tests=error -R '^webview_gui_examples_gain_(core|meter|clap_adapter|webview_resource|webview_param)$'
