name: CLAP scale contract

on:
  push:
    branches:
      - main
      - 'fix/43-*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: clap-scale-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scale-contract:
    name: ${{ matrix.os }} / unsupported scale fails closed
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Install Ninja on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Configure
        run: cmake -S tests/clap-scale-contract -B build-clap-scale -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-clap-scale --parallel

      - name: Test unsupported scaling contract
        run: ctest --test-dir build-clap-scale --output-on-failure
