name: Plugin-safe CMake profile

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: plugin-safe-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: ${{ matrix.os }} / private module exports
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Install Ninja on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Configure plugin-safe consumer with BUILD_SHARED_LIBS=ON
        run: cmake -S tests/plugin_safe_profile -B build-plugin-safe -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build private test modules
        run: cmake --build build-plugin-safe --parallel

      - name: Verify exported symbol surface
        run: ctest --test-dir build-plugin-safe --output-on-failure

      - name: Capture Windows export scan diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          ctest --test-dir build-plugin-safe -V 2>&1 | Out-File -FilePath windows-export-scan.txt -Encoding utf8
          exit 0

      - name: Upload Windows export scan diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-export-scan
          path: windows-export-scan.txt
          if-no-files-found: error
