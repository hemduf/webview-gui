name: Temporary preset state integration patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/_preset-state-integration-patch.yml'
      - 'examples/gain/gain_plugin.cpp'
      - 'examples/polysynth/polysynth_plugin.cpp'
  push:
    branches:
      - feat/36-preset-subsystem
    paths:
      - '.github/workflows/_preset-state-integration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'feat/36-preset-subsystem') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feat/36-preset-subsystem')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/36-preset-subsystem
          fetch-depth: 0

      - name: Apply asserted integration refactor
        id: patch
        shell: python
        run: |
          import os
          from pathlib import Path

          def set_changed(value):
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write(f"changed={str(value).lower()}\n")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          gain_path = Path('examples/gain/gain_plugin.cpp')
          poly_path = Path('examples/polysynth/polysynth_plugin.cpp')
          gain = gain_path.read_text()
          poly = poly_path.read_text()

          already_integrated = (
              'gain_persistent_state.h' in gain and
              'gain_preset_state.h' in gain and
              'GainParameterSnapshot' in gain and
              'captureGainPreset' in gain and
              'makeGainPresetCandidate' in gain and
              'polysynth_parameter_snapshot.h' in poly and
              'polysynth_preset_state.h' in poly and
              'capturePolySynthPreset' in poly and
              'makePolySynthPresetCandidate' in poly and
              'struct ParameterSnapshot' not in poly
          )
          if already_integrated:
              print('Preset state integration already applied; no-op.')
              set_changed(False)
              raise SystemExit(0)

          gain = replace_once(
              gain,
              '#include "gain_plugin.h"\n#include "gain_webview_parameter_bridge.h"\n',
              '#include "gain_plugin.h"\n#include "gain_persistent_state.h"\n#include "gain_preset_state.h"\n#include "gain_webview_parameter_bridge.h"\n',
              'Gain includes')
          gain = replace_once(
              gain,
              '''    bool stateSave(const clap_ostream_t *stream) noexcept override {\n        const auto bytes = encodeState(\n            static_cast<double>(gainDbSnapshot_.load(std::memory_order_relaxed)),\n            bypassSnapshot_.load(std::memory_order_relaxed));\n        return writeAll(stream, bytes.data(), bytes.size());\n    }\n''',
              '''    bool stateSave(const clap_ostream_t *stream) noexcept override {\n        const auto snapshot = readEffectiveGainParameterSnapshot();\n        const auto bytes = encodeState(static_cast<double>(snapshot.gainDb),\n                                       snapshot.bypassed);\n        return writeAll(stream, bytes.data(), bytes.size());\n    }\n''',
              'Gain stateSave')
          gain = replace_once(
              gain,
              '''        double gainDb = 0.0;\n        bool bypassed = false;\n        if (!decodeState(bytes, gainDb, bypassed))\n            return false;\n\n        const auto gain = static_cast<float>(gainDb);\n        const bool parameterValuesChanged =\n            gainDbSnapshot_.load(std::memory_order_relaxed) != gain ||\n            bypassSnapshot_.load(std::memory_order_relaxed) != bypassed;\n\n        pendingLoadedGainDb_.store(gain, std::memory_order_relaxed);\n        pendingLoadedBypass_.store(bypassed, std::memory_order_relaxed);\n        loadedStateRevision_.fetch_add(1u, std::memory_order_release);\n        gainDbSnapshot_.store(gain, std::memory_order_relaxed);\n        bypassSnapshot_.store(bypassed, std::memory_order_relaxed);\n\n        if (parameterValuesChanged) {\n            const auto *hostParams = resolveHostParams();\n            if (hostParams && hostParams->rescan)\n                hostParams->rescan(host_, CLAP_PARAM_RESCAN_VALUES);\n        }\n        return true;\n''',
              '''        double gainDb = 0.0;\n        bool bypassed = false;\n        if (!decodeState(bytes, gainDb, bypassed))\n            return false;\n\n        const GainParameterSnapshot loaded{static_cast<float>(gainDb), bypassed};\n        return commitPersistentParameterSnapshot(loaded, true);\n''',
              'Gain stateLoad publication')

          gain_private_marker = '''private:\n    const clap_host_params_t *resolveHostParams() noexcept {\n'''
          gain_helpers = '''private:\n    [[nodiscard]] GainParameterSnapshot readEffectiveGainParameterSnapshot() const noexcept {\n        return {gainDbSnapshot_.load(std::memory_order_relaxed),\n                bypassSnapshot_.load(std::memory_order_relaxed)};\n    }\n\n    bool commitPersistentParameterSnapshot(const GainParameterSnapshot &snapshot,\n                                           bool notifyHostParams) noexcept {\n        const bool parameterValuesChanged =\n            gainDbSnapshot_.load(std::memory_order_relaxed) != snapshot.gainDb ||\n            bypassSnapshot_.load(std::memory_order_relaxed) != snapshot.bypassed;\n\n        pendingLoadedGainDb_.store(snapshot.gainDb, std::memory_order_relaxed);\n        pendingLoadedBypass_.store(snapshot.bypassed, std::memory_order_relaxed);\n        loadedStateRevision_.fetch_add(1u, std::memory_order_release);\n        gainDbSnapshot_.store(snapshot.gainDb, std::memory_order_relaxed);\n        bypassSnapshot_.store(snapshot.bypassed, std::memory_order_relaxed);\n\n        if (notifyHostParams && parameterValuesChanged) {\n            const auto *hostParams = resolveHostParams();\n            if (hostParams && hostParams->rescan)\n                hostParams->rescan(host_, CLAP_PARAM_RESCAN_VALUES);\n        }\n        return true;\n    }\n\n    [[nodiscard]] presets::PresetDocument captureGainPresetDocument(\n        presets::PresetMetadata metadata) const {\n        return captureGainPreset(readEffectiveGainParameterSnapshot(), metadata);\n    }\n\n    presets::PresetStateAdapterError applyGainPresetDocument(\n        const presets::PresetDocument &document) noexcept {\n        const auto mapped = makeGainPresetCandidate(document);\n        if (!mapped.ok())\n            return mapped.error;\n        (void)commitPersistentParameterSnapshot(*mapped.candidate, false);\n        return presets::PresetStateAdapterError::None;\n    }\n\n    const clap_host_params_t *resolveHostParams() noexcept {\n'''
          gain = replace_once(gain, gain_private_marker, gain_helpers, 'Gain private helpers')
          gain_path.write_text(gain)

          poly = replace_once(
              poly,
              '#include "polysynth_plugin.h"\n#include "polysynth_parameter_voice_engine.h"\n',
              '#include "polysynth_plugin.h"\n#include "polysynth_parameter_snapshot.h"\n#include "polysynth_parameter_voice_engine.h"\n#include "polysynth_preset_state.h"\n',
              'PolySynth includes')

          snapshot_start = poly.find('struct ParameterSnapshot {')
          copy_name_marker = '\nbool copyName(char *destination'
          snapshot_end = poly.find(copy_name_marker, snapshot_start)
          if snapshot_start < 0 or snapshot_end < 0:
              raise SystemExit('PolySynth local snapshot block markers not found')
          removed = poly[snapshot_start:snapshot_end]
          for required in ('struct ParameterSnapshot', 'parameterSnapshotsEqual', 'parameterSnapshotValue'):
              if required not in removed:
                  raise SystemExit(f'PolySynth snapshot block missing {required}')
          poly = poly[:snapshot_start] + poly[snapshot_end + 1:]

          state_commit_start = poly.find('        ParameterSnapshot current{};', poly.find('bool stateLoad('))
          state_context_marker = '\n    bool implementsStateContext() const noexcept override'
          state_commit_end = poly.find(state_context_marker, state_commit_start)
          if state_commit_start < 0 or state_commit_end < 0:
              raise SystemExit('PolySynth stateLoad publication block markers not found')
          old_publication = poly[state_commit_start:state_commit_end]
          for required in ('publishPendingParameterSnapshot(loaded)',
                           'loadedStateRevision_.fetch_add',
                           'hostParams_->rescan'):
              if required not in old_publication:
                  raise SystemExit(f'PolySynth stateLoad publication block missing {required}')
          poly = (poly[:state_commit_start] +
                  '        return commitPersistentParameterSnapshot(loaded, true);\n    }\n' +
                  poly[state_commit_end:])

          poly_private_marker = '''private:\n    ParameterSnapshot loadHostParameterSnapshotRelaxed() const noexcept {\n'''
          poly_helpers = '''private:\n    bool commitPersistentParameterSnapshot(const ParameterSnapshot &loaded,\n                                           bool notifyHostParams) noexcept {\n        ParameterSnapshot current{};\n        const bool haveCurrent = readEffectiveParameterSnapshot(current);\n        const bool parameterValueChanged =\n            !haveCurrent || !parameterSnapshotsEqual(current, loaded);\n\n        if (active_) {\n            std::uint32_t loadedTailSamples = 0u;\n            if (!releaseSecondsToTailSamples(loaded.ampReleaseSeconds,\n                                             activeSampleRate_,\n                                             loadedTailSamples))\n                return false;\n            const auto loadedRevisionBefore =\n                loadedStateRevision_.load(std::memory_order_acquire);\n            const auto tailRevision =\n                tailLoadedStateRevisionPublished_.load(std::memory_order_acquire);\n            if (loadedRevisionBefore != tailRevision) {\n                loadedTailSamples = std::max(\n                    loadedTailSamples,\n                    pendingLoadedTailSamples_.load(std::memory_order_acquire));\n            }\n            pendingLoadedTailSamples_.store(loadedTailSamples,\n                                            std::memory_order_release);\n        }\n\n        publishPendingParameterSnapshot(loaded);\n        const auto loadedRevision =\n            loadedStateRevision_.fetch_add(1u, std::memory_order_release) + 1u;\n\n        if (!active_) {\n            publishHostParameterSnapshot(loaded);\n            appliedLoadedStateRevision_ = loadedRevision;\n            appliedLoadedStateRevisionPublished_.store(loadedRevision,\n                                                       std::memory_order_release);\n        }\n\n        if (notifyHostParams && parameterValueChanged && hostParams_ && hostParams_->rescan)\n            hostParams_->rescan(host_, CLAP_PARAM_RESCAN_VALUES);\n        return true;\n    }\n\n    [[nodiscard]] presets::PresetDocument capturePolySynthPresetDocument(\n        presets::PresetMetadata metadata) const {\n        ParameterSnapshot snapshot{};\n        if (!readEffectiveParameterSnapshot(snapshot))\n            return {};\n        return capturePolySynthPreset(snapshot, metadata);\n    }\n\n    presets::PresetStateAdapterError applyPolySynthPresetDocument(\n        const presets::PresetDocument &document) noexcept {\n        const auto mapped = makePolySynthPresetCandidate(document);\n        if (!mapped.ok())\n            return mapped.error;\n        if (!commitPersistentParameterSnapshot(*mapped.candidate, false))\n            return presets::PresetStateAdapterError::InvalidKnownParameter;\n        return presets::PresetStateAdapterError::None;\n    }\n\n    ParameterSnapshot loadHostParameterSnapshotRelaxed() const noexcept {\n'''
          poly = replace_once(poly, poly_private_marker, poly_helpers, 'PolySynth private helpers')
          poly_path.write_text(poly)

          set_changed(True)

      - name: Verify intended diff
        if: steps.patch.outputs.changed == 'true'
        run: |
          git diff --check
          git diff -- examples/gain/gain_plugin.cpp examples/polysynth/polysynth_plugin.cpp

      - name: Commit integration refactor
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name "webview-gui preset TDD"
          git config user.email "actions@users.noreply.github.com"
          git add examples/gain/gain_plugin.cpp examples/polysynth/polysynth_plugin.cpp
          git commit -m "refactor(presets): reuse plug-in persistent snapshots"
          git push origin HEAD:feat/36-preset-subsystem
