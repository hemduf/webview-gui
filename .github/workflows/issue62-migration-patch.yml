name: Issue 62 migration patch

on:
  push:
    branches: [feat/62-vite-react-ui]
    paths:
      - '.github/workflows/issue62-migration-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/62-vite-react-ui
          fetch-depth: 0
      - name: Migrate native and WCLAP resource serving
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one anchor, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          def sub_once(path, pattern, repl):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, got {count}")
              p.write_text(updated)

          cmake = 'examples/CMakeLists.txt'
          replace_once(cmake,
              'include("${CMAKE_CURRENT_LIST_DIR}/cmake/PresetResources.cmake")\n',
              'include("${CMAKE_CURRENT_LIST_DIR}/cmake/PresetResources.cmake")\ninclude("${CMAKE_CURRENT_LIST_DIR}/cmake/WebResources.cmake")\n')
          replace_once(cmake,
              'if(WEBVIEW_GUI_EXAMPLES_BUILD_GAIN)\n    add_library(webview_gui_example_gain_clap_core STATIC\n',
              'if(WEBVIEW_GUI_EXAMPLES_BUILD_GAIN)\n    webview_gui_add_web_resources(\n        TARGET webview_gui_example_gain_web\n        SOURCE_DIR "${CMAKE_CURRENT_LIST_DIR}/gain/ui"\n        NAMESPACE "webview_gui::examples::gain::resources"\n    )\n\n    add_library(webview_gui_example_gain_clap_core STATIC\n')
          replace_once(cmake,
              '    target_link_libraries(webview_gui_example_gain_clap_core\n        PUBLIC clap-helpers\n        PRIVATE webview-gui\n    )\n',
              '    target_link_libraries(webview_gui_example_gain_clap_core\n        PUBLIC clap-helpers webview_gui_example_gain_web\n        PRIVATE webview-gui\n    )\n')
          replace_once(cmake,
              'if(WEBVIEW_GUI_EXAMPLES_BUILD_POLYSYNTH)\n    add_subdirectory(polysynth)\n',
              'if(WEBVIEW_GUI_EXAMPLES_BUILD_POLYSYNTH)\n    webview_gui_add_web_resources(\n        TARGET webview_gui_example_polysynth_web\n        SOURCE_DIR "${CMAKE_CURRENT_LIST_DIR}/polysynth/ui"\n        NAMESPACE "webview_gui::examples::polysynth::resources"\n    )\n    add_subdirectory(polysynth)\n    target_link_libraries(webview_gui_example_polysynth_clap_core\n        PUBLIC webview_gui_example_polysynth_web)\n')

          replace_once('examples/gain/wclap/CMakeLists.txt',
              '    COMPILE_TARGETS webview_gui_example_gain_clap_core\n    RESOURCE_DIRECTORY "${WEBVIEW_GUI_EXAMPLES_PRESET_RESOURCE_DIRECTORY}"\n',
              '    COMPILE_TARGETS webview_gui_example_gain_clap_core\n    WEB_RESOURCE_TARGET webview_gui_example_gain_web\n    RESOURCE_DIRECTORY "${WEBVIEW_GUI_EXAMPLES_PRESET_RESOURCE_DIRECTORY}"\n')
          replace_once('examples/polysynth/wclap/CMakeLists.txt',
              '    COMPILE_TARGETS webview_gui_example_polysynth_clap_core\n    RESOURCE_DIRECTORY "${WEBVIEW_GUI_EXAMPLES_PRESET_RESOURCE_DIRECTORY}"\n',
              '    COMPILE_TARGETS webview_gui_example_polysynth_clap_core\n    WEB_RESOURCE_TARGET webview_gui_example_polysynth_web\n    RESOURCE_DIRECTORY "${WEBVIEW_GUI_EXAMPLES_PRESET_RESOURCE_DIRECTORY}"\n')

          gain = 'examples/gain/gain_plugin.cpp'
          replace_once(gain, '#include "gain_webview_parameter_bridge.h"\n',
                             '#include "gain_webview_parameter_bridge.h"\n#include "webview_gui_example_gain_web_resources.h"\n')
          replace_once(gain,
              'constexpr const char kEditorMime[] = "text/html; charset=utf-8";\nconstexpr const char kEditorScriptUri[] = "/gain.js";\nconstexpr const char kEditorScriptMime[] = "text/javascript; charset=utf-8";\n', '')
          sub_once(gain,
              r'constexpr const char kEditorHtml\[\] = R"html\(.*?\)js";\n\n', '')
          sub_once(gain,
              r'        const char \*resourceMime = nullptr;\n        const uint8_t \*resourceData = nullptr;\n        std::size_t resourceSize = 0;\n        if \(std::strcmp\(path, kEditorUri\) == 0\) \{.*?        return writeAll\(dataStream, resourceData, resourceSize\);',
              '''        const auto *resource = resources::find(path);\n        if (!resource)\n            return false;\n        if (!copyExactText(mime, mimeCapacity, resource->mimeType.data()))\n            return false;\n        return writeAll(dataStream, resource->data, resource->size);''')

          poly = 'examples/polysynth/wclap/polysynth_wclap_proxy.h'
          replace_once(poly, '#include "../polysynth_parameters.h"\n',
                             '#include "../polysynth_parameters.h"\n#include "webview_gui_example_polysynth_web_resources.h"\n')
          replace_once(poly,
              'inline constexpr char kEditorMime[] = "text/html; charset=utf-8";\ninline constexpr char kEditorScriptUri[] = "/polysynth.js";\ninline constexpr char kEditorScriptMime[] = "text/javascript; charset=utf-8";\n', '')
          sub_once(poly,
              r'inline constexpr char kEditorHtml\[\] = R"html\(.*?\)js";\n\n', '')
          sub_once(poly,
              r'        const char \*resourceMime = nullptr;\n        const std::uint8_t \*resourceData = nullptr;\n        std::size_t resourceSize = 0u;\n        if \(std::strcmp\(path, kEditorUri\) == 0\) \{.*?        return copyExactText\(mime, mimeCapacity, resourceMime\) &&\n               writeAll\(stream, resourceData, resourceSize\);',
              '''        const auto *resource = ::webview_gui::examples::polysynth::resources::find(path);\n        if (!resource)\n            return false;\n        return copyExactText(mime, mimeCapacity, resource->mimeType.data()) &&\n               writeAll(stream, resource->data, resource->size);''')

          browser = 'examples/polysynth/wclap/polysynth_preset_browser_proxy.h'
          sub_once(browser,
              r'inline constexpr char kPresetBrowserScriptUri\[\].*?inline const std::string &augmentedEditorHtml\(\) \{.*?\n\}\n\n', '')
          sub_once(browser,
              r'    static bool CLAP_ABI webviewGetResource\(const clap_plugin_t \*outer,\n                                             const char \*path,\n                                             char \*mime,\n                                             std::uint32_t mimeCapacity,\n                                             const clap_ostream_t \*stream\) \{.*?\n    \}\n\n    static bool CLAP_ABI webviewReceive',
              '''    static bool CLAP_ABI webviewGetResource(const clap_plugin_t *outer,\n                                             const char *path,\n                                             char *mime,\n                                             std::uint32_t mimeCapacity,\n                                             const clap_ostream_t *stream) {\n        return BaseProxy::webviewGetResource(outer, path, mime, mimeCapacity, stream);\n    }\n\n    static bool CLAP_ABI webviewReceive''')

          # Replace old inline-editor assumptions with Vite bundle checks. The
          # transport itself is covered by the existing native binary protocol tests.
          tests = 'examples/tests/gain_webview_resource_tests.cpp'
          sub_once(tests,
              r'    const std::string html\(htmlOutput.bytes.begin\(\), htmlOutput.bytes.end\(\)\);\n.*?    MemoryOutputStream unknownOutput;',
              '''    const std::string html(htmlOutput.bytes.begin(), htmlOutput.bytes.end());\n    if (!contains(html, "id=\\\"root\\\"") ||\n        !contains(html, "script-src 'self'") ||\n        !contains(html, "type=\\\"module\\\"") ||\n        contains(html, "http://") || contains(html, "https://") || contains(html, "//cdn.")) {\n        std::cerr << "bundled Gain editor is not a self-contained Vite entry point\\n";\n        plugin->destroy(plugin);\n        return 9;\n    }\n\n    const auto scriptMarker = html.find("<script type=\\\"module\\\" crossorigin src=\\\"");\n    const auto fallbackMarker = html.find("<script type=\\\"module\\\" src=\\\"");\n    const auto marker = scriptMarker != std::string::npos ? scriptMarker : fallbackMarker;\n    if (marker == std::string::npos) {\n        std::cerr << "Vite entry does not reference its module asset\\n";\n        plugin->destroy(plugin);\n        return 90;\n    }\n    const auto src = html.find("src=\\\"", marker);\n    const auto srcEnd = src == std::string::npos ? std::string::npos : html.find('\\\"', src + 5u);\n    if (src == std::string::npos || srcEnd == std::string::npos) {\n        plugin->destroy(plugin);\n        return 91;\n    }\n    std::string scriptPath = html.substr(src + 5u, srcEnd - (src + 5u));\n    if (!scriptPath.empty() && scriptPath[0] == '.')\n        scriptPath.erase(0u, 1u);\n    if (scriptPath.empty() || scriptPath[0] != '/') {\n        plugin->destroy(plugin);\n        return 92;\n    }\n\n    MemoryOutputStream scriptOutput(5);\n    char scriptMime[64] = {};\n    if (!webview->get_resource(plugin, scriptPath.c_str(), scriptMime, sizeof(scriptMime),\n                               &scriptOutput.stream) ||\n        std::strcmp(scriptMime, "application/javascript; charset=utf-8") != 0 ||\n        scriptOutput.bytes.empty()) {\n        std::cerr << "bundled Vite JavaScript asset was not served correctly\\n";\n        plugin->destroy(plugin);\n        return 93;\n    }\n    const std::string script(scriptOutput.bytes.begin(), scriptOutput.bytes.end());\n    if (contains(script, "http://") || contains(script, "https://") ||\n        contains(script, "XMLHttpRequest")) {\n        std::cerr << "Gain frontend introduced a remote runtime dependency\\n";\n        plugin->destroy(plugin);\n        return 94;\n    }\n\n    MemoryOutputStream unknownOutput;''')

          Path('.github/workflows/issue62-migration-patch.yml').unlink()

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[#62][GREEN] serve generated Vite resources"
          git pull --rebase origin feat/62-vite-react-ui
          git push origin HEAD:feat/62-vite-react-ui
