name: Preset core contract

on:
  pull_request:
    paths:
      - 'examples/common/presets/**'
      - 'examples/tests/preset_core/**'
      - '.github/workflows/preset-core.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/common/presets/**'
      - 'examples/tests/preset_core/**'
      - '.github/workflows/preset-core.yml'
  workflow_dispatch:

concurrency:
  group: preset-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preset-core:
    name: ${{ matrix.os }} preset core
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Configure preset core
        run: cmake -S examples/tests/preset_core -B build-preset-core

      - name: Build preset core
        run: cmake --build build-preset-core --config Debug --parallel

      - name: Run preset core
        run: ctest --test-dir build-preset-core -C Debug --output-on-failure --no-tests=error

      - name: Configure existing plug-in state regression tests
        run: >-
          cmake
          -S examples
          -B build-preset-state-regression
          -DWEBVIEW_GUI_SOURCE_DIR="${{ github.workspace }}"
          -DWEBVIEW_GUI_EXAMPLES_BUILD_GAIN=ON
          -DWEBVIEW_GUI_EXAMPLES_BUILD_POLYSYNTH=ON
          -DWEBVIEW_GUI_EXAMPLES_BUILD_WRAPPERS=OFF

      - name: Build existing plug-in state regression tests
        run: >-
          cmake --build build-preset-state-regression
          --target
          webview_gui_example_gain_core_tests
          webview_gui_example_gain_state_host_sync_tests
          webview_gui_example_polysynth_parameter_model_tests
          webview_gui_example_polysynth_state_tests
          webview_gui_example_polysynth_state_snapshot_concurrency_tests
          webview_gui_example_polysynth_state_context_tests
          --config Debug --parallel

      - name: Run existing plug-in state regression tests
        run: >-
          ctest --test-dir build-preset-state-regression -C Debug --output-on-failure
          --no-tests=error -R '^webview_gui_examples_(gain_(core|state_host_sync)|polysynth_(parameter_model|state|state_snapshot_concurrency|state_context))$'
